<!--template to create a sale-->

{% extends 'project/base.html' %}
{% load static %}

{% block content %}
    <div class="formcenter">
        <h1>Create sale for {{customer.first_name}} {{customer.last_name}}?</h1>
        <!--form to create a sale-->
        <form method="POST">
            {% csrf_token %}
            <input type="submit" value="Yes" class="btn">
            <!--provide a cancel option-->
            <a href="{% url 'customer' customer.pk %}" class="btn">
                Cancel
            </a>
        </form>
    </div>
{% endblock %}
