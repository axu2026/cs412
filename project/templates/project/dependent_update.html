<!--template to provide form to update a customer dependent-->

{% extends 'project/base.html' %}
{% load static %}

{% block content %}
    <div class="formcenter">
        <h1>Updating {{dependent}}</h1>
        <!--form to create a dependent-->
        <form method="POST">
            {% csrf_token %}
            {{form}}
            <br>
            <input type="submit" value="Update" class="btn">
            <a href="{% url 'customer' dependent.guardian.pk %}" class="btn">
                Go Back
            </a>
        </form>
    </div>
{% endblock %}
