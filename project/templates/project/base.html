<!--base template containing header, footer, and content for every page-->

{% load static %}
<html>
    <head>
        <title>Jump World!™ POS</title>
        <link rel="stylesheet" href="{% static 'project.css' %}">
    </head>
    <body>
        <div class="container">
            <header>
                <div>
                    <a href="{% url 'home' %}">
                        <img src="{% static 'jumpworld.png' %}" alt="logo">
                    </a>
                </div>
                <div style="text-align: right;">
                    <!--show if there is a user currently authenticated-->
                    {% if request.user.is_authenticated %}
                        <div class="headerinfo">
                            <span style="margin-right: 2em;">Welcome {{request.user}}</span>
                            <!--provide a logout button-->
                            <form action="{% url 'logout' %}" method="POST" 
                            style="display: inline-block;" class="logout">
                                {% csrf_token %}
                                <input type="submit", value="Log out" class="logoutbtn">
                            </form>
                        </div>
                    {% else %}
                        <!--provide login/out options in header if not logged in-->
                        <div class="headerinfo">
                            <span style="margin-right: 2em;">Not logged in</span>
                            <a href="{% url 'create_customer' %}">
                                Create Account
                            </a>
                            <a href="{% url 'login' %}">
                                Log In
                            </a>
                        </div>
                    {% endif %}
                </div>
            </header>
            <!--main content-->
            <div class="content">
                {% block content %}
                {% endblock %}
            </div>
            <footer>
                <p>Aidan Xu (axu26@bu.edu) CS 412, Fall 2025</p>
            </footer>
        </div>
    </body>
</html>
