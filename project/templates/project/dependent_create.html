<!--template to provide form to create a customer dependent-->

{% extends 'project/base.html' %}
{% load static %}

{% block content %}
    <h1>Add dependent to {{guardian}}</h1>
    <!--form to create a dependent-->
    <form method="POST">
        {% csrf_token %}
        {{form}}
        <input type="submit" value="Add">
    </form>
    <br>
    <a href="{% url 'customer' guardian.pk %}">
        Go back
    </a>
{% endblock %}
