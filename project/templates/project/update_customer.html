<!--template to update customer details-->

{% extends 'project/base.html' %}
{% load static %}

{% block content %}
    <div>
        <form method="POST">
            {% csrf_token %}
            {{form}}
            <input type="submit" value="Update" class="button">
        </form>
        <a href="{% url 'customer' customer.pk %}">
            Go back
        </a>
    </div>
{% endblock %}
