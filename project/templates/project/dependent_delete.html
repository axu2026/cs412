<!--template to delete a dependent-->

{% extends 'project/base.html' %}
{% load static %}

{% block content %}
    <div class="formcenter">
        <h1>Remove {{dependent}}?</h1>
        <!--form to confirm deletion of dependent-->
        <form method="POST">
            {% csrf_token %}
            <br>
            <input type="submit" value="Yes" class="btn">
            <!--provide cancel option-->
            <a href="{% url 'customer' dependent.guardian.pk %}" class="btn">
                Go Back
            </a>
        </form>
    </div>
{% endblock %}
